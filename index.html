<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyBooks</title>
<style>
  :root{
    --morado:#6b3fa0; --lila:#9b7bd1; --lila-claro:#f1ebfa;
    --texto:#2b2433; --gris:#6f6878; --borde:#e3dcec; --fondo:#faf8fd;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--fondo);color:var(--texto)}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px}
  .wrap.ancho{max-width:none;width:100%;padding:24px 24px}   /* resultados: usa todo el ancho de la pantalla */
  h1{font-size:1.4rem;margin:0 0 4px;color:var(--morado)}
  .sub{color:var(--gris);margin:0 0 20px;font-size:.95rem}

  /* Pantalla de confirmación */
  .card{background:#fff;border:1px solid var(--borde);border-radius:14px;
        padding:28px;max-width:440px;margin:8vh auto 0;box-shadow:0 6px 24px rgba(107,63,160,.08)}
  label{display:block;font-weight:600;margin:16px 0 6px;font-size:.9rem}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--borde);border-radius:9px;
        font-size:1rem;background:#fff;color:var(--texto)}
  input[type=date]{background:var(--lila-claro);color:var(--morado);font-weight:600;font-family:inherit;cursor:pointer}
  .fechas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fechas label{margin-top:16px}
  .nota{font-size:.8rem;color:var(--gris);margin-top:6px}
  button{cursor:pointer;border:0;border-radius:9px;padding:12px 18px;font-size:1rem;font-weight:600}
  .btn{background:var(--morado);color:#fff;width:100%;margin-top:22px}
  .btn:hover{background:#5a3289}
  .btn:disabled{background:#c9bde0;cursor:not-allowed}
  .btn-sec{background:var(--lila-claro);color:var(--morado)}
  .msg{margin-top:14px;font-size:.9rem;color:var(--gris)}
  .error{color:#b3261e}

  /* Resultados */
  #paso2{margin-top:10vh}
  .barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--lila-claro);color:var(--morado);padding:6px 12px;border-radius:999px;font-size:.88rem;font-weight:600}
  .tabla-wrap{overflow-x:auto;background:#fff;border:1px solid var(--borde);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  thead th{background:var(--morado);color:#fff;text-align:left;text-transform:uppercase;
           font-size:.8rem;letter-spacing:.02em;padding:11px 10px;white-space:nowrap;position:sticky;top:0}
  tbody td{padding:9px 10px;border-top:1px solid var(--borde);vertical-align:top}
  td.nowrap, tbody td:first-child{white-space:nowrap}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even){background:#fbf9fe}
  tbody tr:hover{background:var(--lila-claro)}
  .vacio{padding:32px;text-align:center;color:var(--gris)}
  .acciones{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .porpag{display:flex;align-items:center;gap:8px;margin:0;font-weight:600;font-size:.88rem;color:var(--gris)}
  .porpag select{width:auto;padding:8px 10px;font-weight:600;color:var(--morado);cursor:pointer}
  .paginador{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
             margin-top:14px;font-size:.88rem;color:var(--gris)}
  .pag-btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pag-btns button{padding:8px 12px;font-size:.88rem}
  .pag-btns button:disabled{opacity:.4;cursor:not-allowed}
  #pagInfo{padding:0 8px;font-weight:600;color:var(--morado)}
  /* Encabezados con orden y filtro */
  thead th{padding:0}
  .th-in{display:flex;align-items:stretch}
  .th-orden{flex:1;display:flex;align-items:center;gap:6px;background:none;color:#fff;border-radius:0;
            padding:11px 10px;font:inherit;text-transform:inherit;letter-spacing:inherit;text-align:left;white-space:nowrap}
  .th-orden:hover{background:rgba(255,255,255,.12)}
  .th-orden .flecha{font-size:.7rem;opacity:.45}
  .th-orden.on .flecha{opacity:1}
  .th-filtro{background:none;color:#fff;border-radius:6px;padding:0 9px;margin:6px 6px 6px 0;display:flex;align-items:center;opacity:.75}
  .th-filtro:hover{background:rgba(255,255,255,.18);opacity:1}
  .th-filtro.on{background:#fff;color:var(--morado);opacity:1}
  .chip-prov{display:inline-flex;align-items:center;gap:6px;background:var(--morado);color:#fff}
  .chip-prov button{background:none;color:#fff;padding:0 2px;font-size:1rem;line-height:1}

  /* Ventana de filtro */
  .pop{position:absolute;z-index:50;width:300px;background:#fff;border:1px solid var(--borde);border-radius:12px;
       box-shadow:0 12px 32px rgba(43,36,51,.18);padding:14px}
  .pop-tit{font-weight:700;color:var(--morado);margin-bottom:10px}
  .pop input[type=search]{padding:8px 10px;font-size:.9rem}
  .pop-acc{display:flex;gap:14px;margin:8px 0 6px}
  .lnk{background:none;padding:0;font-size:.82rem;color:var(--morado);font-weight:600}
  .lnk:hover{text-decoration:underline}
  .prov-lista{max-height:260px;overflow:auto;border-top:1px solid var(--borde);border-bottom:1px solid var(--borde);margin:0 -14px;padding:4px 0}
  .prov-item{display:flex;align-items:center;gap:8px;margin:0;padding:7px 14px;font-weight:400;font-size:.88rem;cursor:pointer}
  .prov-item:hover{background:var(--lila-claro)}
  .prov-item input{width:auto;accent-color:var(--morado)}
  .prov-nom{flex:1}
  .prov-n{font-size:.78rem;color:var(--gris);background:var(--lila-claro);border-radius:999px;padding:1px 8px}
  .pop-pie{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
  .pop-pie button{padding:8px 14px;font-size:.88rem}
  .btn-ok{background:var(--morado);color:#fff}
  .btn-ok:hover{background:#5a3289}
  .oculto{display:none !important}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <!-- PASO 1: confirmar Rep y fecha -->
  <section id="paso1" class="card">
    <h1>Daily Books per Rep</h1>
    <p class="sub">Confirma tu nombre para ver tu información.</p>

    <label for="rep">Nombre del Rep</label>
    <select id="rep" disabled><option>Cargando…</option></select>

    <div class="fechas">
      <div>
        <label for="inicio">Fecha inicio</label>
        <input type="date" id="inicio">
      </div>
      <div>
        <label for="fin">Fecha fin</label>
        <input type="date" id="fin">
      </div>
    </div>
    <div class="nota">Por defecto se muestra el día de hoy. Cámbialas solo si quieres ver otro periodo.</div>

    <button id="confirmar" class="btn" disabled>Confirmar</button>
    <div id="msg1" class="msg"></div>
    <div class="nota" style="text-align:right;margin-top:14px;opacity:.6">Versión 2026-10-02 · v8</div>
  </section>

  <!-- PASO 2: resultados -->
  <section id="paso2" class="oculto">
    <div class="barra">
      <div>
        <h1>Daily Books per Rep</h1>
        <div class="chips">
          <span class="chip" id="chipRep"></span>
          <span class="chip" id="chipFecha"></span>
          <span class="chip" id="chipTotal"></span>
          <span class="chip chip-prov oculto" id="chipProv"><span id="chipProvTxt"></span>
            <button id="chipProvX" title="Quitar filtro">×</button></span>
        </div>
      </div>
      <div class="acciones">
        <label class="porpag">Mostrar
          <select id="porPagina">
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          por página
        </label>
        <button id="cambiar" class="btn-sec">Cambiar Rep</button>
      </div>
    </div>
    <div class="tabla-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="vacio" class="vacio oculto">No hay registros para este Rep en las fechas seleccionadas.</div>
    </div>
    <div class="paginador" id="paginador">
      <span id="rango"></span>
      <div class="pag-btns">
        <button class="btn-sec" id="primera" title="Primera página">«</button>
        <button class="btn-sec" id="anterior">‹ Anterior</button>
        <span id="pagInfo"></span>
        <button class="btn-sec" id="siguiente">Siguiente ›</button>
        <button class="btn-sec" id="ultima" title="Última página">»</button>
      </div>
    </div>
  </section>

</div>

<!-- Ventana del filtro de proveedor -->
<div id="popProv" class="pop oculto" role="dialog" aria-label="Filtrar proveedor">
  <div class="pop-tit">Filtrar proveedor</div>
  <input id="provBuscar" type="search" placeholder="Buscar proveedor…">
  <div class="pop-acc">
    <button id="provTodos" class="lnk">Seleccionar todos</button>
    <button id="provNinguno" class="lnk">Quitar todos</button>
  </div>
  <div id="provLista" class="prov-lista"></div>
  <div class="pop-pie">
    <button id="provLimpiar" class="btn-sec">Quitar filtro</button>
    <button id="provAplicar" class="btn-ok">Aplicar</button>
  </div>
</div>

<script>
/* ================= CONFIGURACIÓN =================
   PUB_ID: ID del archivo publicado en la web (2PACX-...)
   GID: número de la pestaña "Daily Books" (aparece en la URL como #gid=XXXX) */
const PUB_ID = "2PACX-1vTragpew-yDOnQFVpy4C0DwlYiMr_nATjoWIUZ6a5JlDGciEeP4ZOHrTAHUzw1Ts3JVwV_qUcKKjOx2";
const GID    = "1925960605";
// Las columnas se localizan por el texto del encabezado (fila 1), así que
// aunque se agreguen o muevan columnas en el archivo, la página las sigue encontrando.
const ENCABEZADO_FECHA = "booked";   // columna de fecha que filtra (contiene "Booked")
const ENCABEZADO_REP   = "rep";      // columna del Rep (contiene "REP", ej. "CARRIER REP")

// Reps que aparecen en la lista (se escriben tal cual se quieren mostrar)
const REPS_PERMITIDOS = [
  "Juan Pablo Inzunza",
  "Ulises Meneses",
  "Montserrat Najera",
  "Uriel Castellanos",
];
// Moneda de UTILIDAD según la DIVISION del viaje
const MONEDA_POR_DIVISION = {
  "national":      "MXN",
  "port freight":  "MXN",
  "crossborder":   "USD",
  "domestic":      "USD",
};
/* ================================================= */

const $ = id => document.getElementById(id);
let encabezados = [], filas = [];
let COL_FECHA = 8, COL_REP = 9, COL_RECOL = 7, COL_PROV = 2, COL_UTIL = 6, COL_DIV = 5;   // valores de respaldo; se recalculan al leer el archivo

// Fecha de hoy en formato dd/mm/aaaa
const hoy = new Date();
const pad = n => String(n).padStart(2,"0");
const HOY_ISO = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-${pad(hoy.getDate())}`;
$("inicio").value = HOY_ISO;
$("fin").value    = HOY_ISO;

// "2026-10-01" -> "01/10/2026" (para mostrar)
const isoADmy = iso => { const [a,m,d] = iso.split("-"); return `${d}/${m}/${a}`; };

// Lee una fecha del archivo (01/10/2026, 2026-10-01, con o sin hora, 24 h o a. m./p. m.)
function leerFecha(v){
  const s = String(v||"").trim();
  let d, m, a, x;
  if ((x = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/)))      [d, m, a] = [x[1], x[2], x[3]];
  else if ((x = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))             [a, m, d] = [x[1], x[2], x[3]];
  else return null;
  const resto = s.slice(x[0].length);
  let H = null, M = null;
  const h = resto.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])?\.?\s*m?/i);
  if (h){
    H = +h[1]; M = +h[2];
    if (h[3]){ const pm = h[3].toLowerCase()==="p"; if (pm && H<12) H += 12; if (!pm && H===12) H = 0; }
  }
  return { d:+d, m:+m, a:+a, H, M };
}

// Número comparable aaaammdd (solo día) — para el filtro de fechas
function claveFecha(v){ const f = leerFecha(v); return f ? f.a*10000 + f.m*100 + f.d : null; }
// Número comparable aaaammddHHMM — para ordenar con hora
function claveFechaHora(v){ const f = leerFecha(v); return f ? (f.a*10000 + f.m*100 + f.d)*10000 + (f.H??0)*100 + (f.M??0) : null; }
const isoAClave = iso => +iso.replace(/-/g,"");

// Da formato dd/mm/aaaa (y opcionalmente HH:MM) a cualquier fecha del archivo
function fmtFecha(v, conHora){
  const f = leerFecha(v);
  if (!f) return String(v??"");                                    // no es fecha: se deja igual
  let r = `${pad(f.d)}/${pad(f.m)}/${f.a}`;
  if (conHora && f.H !== null) r += ` ${pad(f.H)}:${pad(f.M)}`;
  return r;
}

// Normaliza textos para comparar nombres (sin acentos, mayúsculas ni espacios extra)
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
                  .replace(/\s+/g," ").trim().toLowerCase();

// Separa celdas con varios Reps ("Ana / Luis")
const partesRep = v => String(v||"").split("/").map(s => s.trim()).filter(Boolean);

// Lector de CSV que respeta comillas y saltos de línea dentro de celdas
function parseCSV(txt){
  const out=[]; let fila=[], celda="", q=false;
  for (let i=0;i<txt.length;i++){
    const c=txt[i];
    if (q){
      if (c=='"' && txt[i+1]=='"'){ celda+='"'; i++; }
      else if (c=='"') q=false;
      else celda+=c;
    } else if (c=='"') q=true;
    else if (c==','){ fila.push(celda); celda=""; }
    else if (c=='\n'){ fila.push(celda); out.push(fila); fila=[]; celda=""; }
    else if (c!='\r') celda+=c;
  }
  if (celda!=="" || fila.length){ fila.push(celda); out.push(fila); }
  return out;
}

async function cargar(){
  const url = `https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?gid=${GID}&single=true&output=csv&t=${Date.now()}`;
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error(r.status);
    const datos = parseCSV(await r.text());
    const fila1 = datos[0] || [];

    // Busca las columnas por su encabezado
    const iRep   = fila1.findIndex(h => norm(h).split(/\s+/).includes(ENCABEZADO_REP));
    const iFecha = fila1.findIndex(h => norm(h).includes(ENCABEZADO_FECHA));
    if (iRep   >= 0) COL_REP   = iRep;
    if (iFecha >= 0) COL_FECHA = iFecha;
    COL_RECOL = fila1.findIndex(h => norm(h).includes("recoleccion"));   // -1 si no existe
    const iProv = fila1.findIndex(h => norm(h).includes("proveedor"));
    if (iProv >= 0) COL_PROV = iProv;
    const iUtil = fila1.findIndex(h => norm(h).includes("utilidad"));
    if (iUtil >= 0) COL_UTIL = iUtil;
    const iDiv  = fila1.findIndex(h => norm(h).includes("division"));
    if (iDiv  >= 0) COL_DIV  = iDiv;

    // La tabla muestra desde la columna A hasta la columna del Rep, con los títulos de la fila 1
    encabezados = fila1.slice(0, COL_REP + 1);
    filas = datos.slice(1).filter(f => f.some(c => String(c).trim()!==""));

    const sel = $("rep");
    sel.innerHTML = `<option value="">Selecciona tu nombre…</option>` +
      REPS_PERMITIDOS.map(r => `<option>${esc(r)}</option>`).join("");
    sel.disabled = false;
    sel.onchange = () => $("confirmar").disabled = !sel.value;
    $("msg1").textContent = "";
  }catch(e){
    $("rep").innerHTML = "<option>Sin datos</option>";
    $("msg1").innerHTML = `<span class="error">No se pudo leer la información del archivo. Revisa que la pestaña “Daily Books” esté incluida en Archivo › Compartir › Publicar en la web y que el GID sea correcto.</span>`;
  }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function mostrar(){
  const rep = $("rep").value;
  let ini = $("inicio").value || HOY_ISO, fin = $("fin").value || HOY_ISO;
  if (ini > fin) [ini, fin] = [fin, ini];          // si las pusieron al revés, se acomodan
  const kIni = isoAClave(ini), kFin = isoAClave(fin);

  resultados = filas.filter(f => {
    const k = claveFecha(f[COL_FECHA]);
    return k !== null && k >= kIni && k <= kFin &&
           partesRep(f[COL_REP]).some(p => norm(p)===norm(rep));
  });

  $("chipRep").textContent   = "Rep: " + rep;
  $("chipFecha").textContent = ini===fin ? "Fecha: " + isoADmy(ini)
                                         : `Del ${isoADmy(ini)} al ${isoADmy(fin)}`;

  // Estado inicial: ordenado por Fecha Booked (más antiguo primero), sin filtro de proveedor
  orden = { col: COL_FECHA, dir: 1 };
  provSel = null;
  pagina = 1;
  pintarEncabezados();
  pintarPagina();

  $("paso1").classList.add("oculto");
  $("paso2").classList.remove("oculto");
  $("wrap").classList.add("ancho");
}

/* ---------- Ordenar, filtrar y paginar ---------- */
let resultados = [], pagina = 1;
let orden   = { col: null, dir: 1 };   // dir 1 = A-Z / menor a mayor, -1 = Z-A / mayor a menor
let provSel = null;                    // null = todos los proveedores; Set = solo los elegidos

const valorProv = f => String(f[COL_PROV] ?? "").trim() || "(Sin proveedor)";

// Valor para ordenar según el tipo de columna
function valorOrden(f, i){
  const v = String(f[i] ?? "").trim();
  if (v === "") return null;
  if (i===COL_FECHA || i===COL_RECOL) return claveFechaHora(v);
  if (/^-?\$?-?[\d,]+(\.\d+)?$/.test(v)) return parseFloat(v.replace(/[$,]/g,""));   // dinero / números
  return v;
}
function comparar(a, b){
  const i = orden.col, va = valorOrden(a,i), vb = valorOrden(b,i);
  if (va === null && vb === null) return 0;
  if (va === null) return 1;                       // vacíos siempre al final
  if (vb === null) return -1;
  const r = (typeof va === "number" && typeof vb === "number")
            ? va - vb
            : String(va).localeCompare(String(vb), "es", { numeric:true, sensitivity:"base" });
  return r * orden.dir;
}

function vistaActual(){
  let lista = provSel ? resultados.filter(f => provSel.has(valorProv(f))) : resultados.slice();
  if (orden.col !== null) lista.sort(comparar);
  return lista;
}

// Encabezados: fila 1 en mayúsculas; la de recolección con nombre fijo; botón de orden en cada uno
const titulo = (h,i) => i===COL_RECOL ? "FECHA DE RECOLECCIÓN" : String(h).toUpperCase();
function pintarEncabezados(){
  $("thead").innerHTML = "<tr>" + encabezados.map((h,i) => {
    const activo = orden.col === i;
    const flecha = activo ? (orden.dir === 1 ? "▲" : "▼") : "⇅";
    const tip    = activo && orden.dir === 1 ? "Ordenar Z-A" : "Ordenar A-Z";
    const filtro = i === COL_PROV
      ? `<button class="th-filtro${provSel ? " on" : ""}" data-filtro title="Filtrar proveedor">
           <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg>
         </button>` : "";
    return `<th><div class="th-in">
              <button class="th-orden${activo ? " on" : ""}" data-col="${i}" title="${tip}">
                <span>${esc(titulo(h,i))}</span><span class="flecha">${flecha}</span>
              </button>${filtro}
            </div></th>`;
  }).join("") + "</tr>";

  $("thead").querySelectorAll("[data-col]").forEach(b => b.onclick = () => {
    const i = +b.dataset.col;
    orden = orden.col === i ? { col:i, dir:-orden.dir } : { col:i, dir:1 };
    pagina = 1; pintarEncabezados(); pintarPagina();
  });
  const bf = $("thead").querySelector("[data-filtro]");
  if (bf) bf.onclick = e => { e.stopPropagation(); abrirFiltro(bf); };
}

// "$2,500.00" + National -> "$2,500.00 MXN"; Crossborder -> "$400.00 USD"
function fmtUtilidad(v, division){
  const t = String(v ?? "").trim();
  if (t === "") return "";
  const n = parseFloat(t.replace(/[$,\s]/g, ""));
  if (isNaN(n)) return t;                                          // no es número: se deja igual
  const moneda = MONEDA_POR_DIVISION[norm(division)] || "";
  const monto  = (n < 0 ? "-$" : "$") +
                 Math.abs(n).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
  return moneda ? `${monto} ${moneda}` : monto;
}

// Celdas: recolección solo fecha; booked fecha + hora; utilidad con moneda
function celda(v, i, f){
  if (i===COL_RECOL) return `<td class="nowrap">${esc(fmtFecha(v,false))}</td>`;
  if (i===COL_FECHA) return `<td class="nowrap">${esc(fmtFecha(v,true))}</td>`;
  if (i===COL_UTIL)  return `<td class="nowrap num">${esc(fmtUtilidad(v, f[COL_DIV]))}</td>`;
  return `<td>${esc(v??"")}</td>`;
}

function pintarPagina(){
  const lista   = vistaActual();
  const porPag  = +$("porPagina").value;
  const total   = lista.length;
  const paginas = Math.max(1, Math.ceil(total / porPag));
  pagina = Math.min(Math.max(1, pagina), paginas);

  const desde = (pagina - 1) * porPag;
  const vista = lista.slice(desde, desde + porPag);

  $("tbody").innerHTML = vista.map(f =>
    "<tr>" + encabezados.map((_,i)=>celda(f[i],i,f)).join("") + "</tr>").join("");

  $("vacio").textContent = resultados.length === 0
    ? "No hay registros para este Rep en las fechas seleccionadas."
    : "Ningún viaje coincide con el filtro de proveedor.";
  $("vacio").classList.toggle("oculto", total>0);

  // Chips
  const n = resultados.length;
  $("chipTotal").textContent = provSel
    ? `${total} de ${n} registros`
    : n + (n===1 ? " registro" : " registros");
  $("chipProv").classList.toggle("oculto", !provSel);
  if (provSel) $("chipProvTxt").textContent =
    "Proveedor: " + (provSel.size === 1 ? [...provSel][0] : `${provSel.size} seleccionados`);

  // Controles de página
  $("paginador").classList.toggle("oculto", total===0);
  $("rango").textContent   = `Mostrando ${desde + 1}–${desde + vista.length} de ${total}`;
  $("pagInfo").textContent = `Página ${pagina} de ${paginas}`;
  $("primera").disabled = $("anterior").disabled  = pagina <= 1;
  $("ultima").disabled  = $("siguiente").disabled = pagina >= paginas;
}

/* ---------- Filtro de proveedor ---------- */
function abrirFiltro(boton){
  const pop = $("popProv");
  if (!pop.classList.contains("oculto")) { cerrarFiltro(); return; }

  // Proveedores de los resultados actuales (Rep + fechas), con su número de viajes
  const conteo = new Map();
  resultados.forEach(f => { const p = valorProv(f); conteo.set(p, (conteo.get(p)||0) + 1); });
  const provs = [...conteo.keys()].sort((a,b) => a.localeCompare(b, "es", {sensitivity:"base"}));

  $("provLista").innerHTML = provs.map(p => `
    <label class="prov-item">
      <input type="checkbox" value="${esc(p)}" ${!provSel || provSel.has(p) ? "checked" : ""}>
      <span class="prov-nom">${esc(p)}</span><span class="prov-n">${conteo.get(p)}</span>
    </label>`).join("");
  $("provBuscar").value = "";

  const r = boton.getBoundingClientRect();
  pop.classList.remove("oculto");
  const ancho = pop.offsetWidth;
  pop.style.top  = (r.bottom + window.scrollY + 6) + "px";
  pop.style.left = Math.max(8, Math.min(r.left + window.scrollX - 10,
                                        window.scrollX + document.documentElement.clientWidth - ancho - 8)) + "px";
  $("provBuscar").focus();
}
function cerrarFiltro(){ $("popProv").classList.add("oculto"); }

$("provBuscar").oninput = () => {
  const q = norm($("provBuscar").value);
  $("provLista").querySelectorAll(".prov-item").forEach(el =>
    el.style.display = norm(el.textContent).includes(q) ? "" : "none");
};
$("provTodos").onclick = () => $("provLista").querySelectorAll("input").forEach(c => {
  if (c.closest(".prov-item").style.display !== "none") c.checked = true; });
$("provNinguno").onclick = () => $("provLista").querySelectorAll("input").forEach(c => {
  if (c.closest(".prov-item").style.display !== "none") c.checked = false; });
$("provAplicar").onclick = () => {
  const checks = [...$("provLista").querySelectorAll("input")];
  const elegidos = checks.filter(c => c.checked).map(c => c.value);
  provSel = elegidos.length === checks.length ? null : new Set(elegidos);
  pagina = 1; cerrarFiltro(); pintarEncabezados(); pintarPagina();
};
const quitarFiltro = () => { provSel = null; pagina = 1; cerrarFiltro(); pintarEncabezados(); pintarPagina(); };
$("provLimpiar").onclick = quitarFiltro;
$("chipProvX").onclick   = quitarFiltro;

document.addEventListener("click", e => {
  if (!$("popProv").contains(e.target)) cerrarFiltro();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarFiltro(); });
window.addEventListener("resize", cerrarFiltro);

/* ---------- Navegación de páginas ---------- */
const irA = n => { pagina = n; pintarPagina(); $("paso2").scrollIntoView({behavior:"smooth", block:"start"}); };
$("primera").onclick   = () => irA(1);
$("anterior").onclick  = () => irA(pagina - 1);
$("siguiente").onclick = () => irA(pagina + 1);
$("ultima").onclick    = () => irA(Infinity);
$("porPagina").onchange = () => { pagina = 1; pintarPagina(); };

$("confirmar").onclick = mostrar;
$("cambiar").onclick = () => { cerrarFiltro(); $("paso2").classList.add("oculto"); $("paso1").classList.remove("oculto"); $("wrap").classList.remove("ancho"); };

cargar();
</script>
</body>
</html>
